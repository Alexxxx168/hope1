<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Escolar</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logochiquito.png') }}" type="image/png">
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 font-sans text-gray-800 antialiased flex items-center justify-center h-screen">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl space-y-6">
        
        <!-- ENCABEZADO -->
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-xl mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Control Escolar</h1>
            <p class="text-sm text-gray-500">Ingresa tus credenciales para acceder</p>
        </div>

        <!-- MENSAJE DE ERROR (SI EXISTE) -->
        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-lg text-sm flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-rose-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- FORMULARIO -->
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" name="username" required placeholder="Ej. admin o profe_ana" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm transition">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-sm transition duration-200">
                Iniciar Sesión
            </button>
        </form>

        <!-- CREDENCIALES DE PRUEBA -->
        <div class="border-t border-gray-100 pt-4 text-xs text-gray-400 space-y-1">
            <p class="font-medium text-gray-500">Credenciales de prueba integradas:</p>
            <p>• Admin: <code class="bg-gray-100 px-1 py-0.5 rounded text-gray-600">admin</code> / <code class="bg-gray-100 px-1 py-0.5 rounded text-gray-600">1234</code></p>
            <p>• Maestro: <code class="bg-gray-100 px-1 py-0.5 rounded text-gray-600">profe_ana</code> / <code class="bg-gray-100 px-1 py-0.5 rounded text-gray-600">1234</code></p>
        </div>

    </div>

</body>
</html>
